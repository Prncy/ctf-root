name: Backend CI

on:
  push:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CTFRoot.sln
      - name: Build
        run: dotnet build CTFRoot.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test CTFRoot.sln --configuration Release --no-build --verbosity normal
